name: Deploy Zizi branch to SmarterASP.NET

on:
  push:
    branches:
      - Zizi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v1

      - name: Restore packages
        run: nuget restore "Unleashing Potential/Unleashing Potential.csproj"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Build and publish
        run: msbuild "Unleashing Potential/Unleashing Potential.csproj" /p:Configuration=Release /p:DeployOnBuild=true

      - name: Deploy via FTP to SmarterASP.NET
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SMARTERASP_FTP_SERVER }}
          username: ${{ secrets.SMARTERASP_FTP_USERNAME }}
          password: ${{ secrets.SMARTERASP_FTP_PASSWORD }}
          local-dir: ./Unleashing Potential/obj/Release/Package/PackageTmp/
          server-dir: /
          dangerous-clean-slate: false
